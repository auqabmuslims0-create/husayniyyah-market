{% extends 'base.html' %}

{% block title %}الإعدادات{% endblock %}

{% block head %}
<style>
    .settings-card {
        border-radius: 20px;
        border: none;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        background: #fff;
        overflow: hidden;
    }
    body.dark-mode .settings-card {
        background: #1e1e1e;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        color: #fff;
    }
    .settings-header {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #fff;
        padding: 15px 20px;
        text-align: center;
        font-weight: 700;
    }
    .settings-body {
        padding: 25px 20px;
    }
    .custom-input-wrap {
        position: relative;
        margin-bottom: 0;
    }
    .custom-input-wrap .form-control {
        border-radius: 12px;
        padding-right: 40px;
        padding-left: 40px;
        height: 48px;
        background-color: #fff;
        border: 1px solid #ced4da;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-input-wrap .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.2rem rgba(46,93,52,0.15);
    }
    .custom-input-icon {
        position: absolute;
        top: 50%;
        right: 14px;
        transform: translateY(-50%);
        color: #6c757d;
        pointer-events: none;
        z-index: 2;
    }
    body.dark-mode .custom-input-wrap .form-control {
        background-color: #2d2d2d;
        border-color: #444;
        color: #fff;
    }
    body.dark-mode .custom-input-wrap .form-control:focus {
        border-color: #c9a227;
        box-shadow: 0 0 0 0.2rem rgba(201,162,39,0.2);
    }
    body.dark-mode .custom-input-icon {
        color: #adb5bd;
    }
    .btn-save {
        border-radius: 25px;
        padding: 10px;
        font-weight: 600;
        transition: background 0.2s, transform 0.2s;
    }
    .btn-save:hover {
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card settings-card">
                <div class="settings-header">
                    <i class="bi bi-gear"></i> إعدادات النظام
                </div>
                <div class="settings-body">
                    <form method="post">
                        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">سعر الاشتراك الشهري للمتاجر (ل.س)</label>
                            <div class="custom-input-wrap">
                                <i class="bi bi-cash custom-input-icon"></i>
                                <input type="number" step="0.01" min="0" name="subscription_price"
                                       class="form-control" value="{{ subscription_price }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">رقم المحفظة الإلكترونية</label>
                            <div class="custom-input-wrap">
                                <i class="bi bi-wallet2 custom-input-icon"></i>
                                <input type="text" name="wallet_number" class="form-control"
                                       value="{{ wallet_number }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">رسوم التوصيل الافتراضية (ل.س)</label>
                            <div class="custom-input-wrap">
                                <i class="bi bi-truck custom-input-icon"></i>
                                <input type="number" step="0.01" min="0" name="delivery_fee"
                                       class="form-control" value="{{ delivery_fee }}" required>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-custom btn-save">حفظ الإعدادات</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
