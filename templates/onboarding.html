<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بك - سوق الحسينية</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.rtl.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/fonts/tajawal.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/variables.css') }}" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #f7f4ef 0%, #e8f0e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .onboarding-container {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 30px;
      padding: 30px 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .slide {
      display: none;
      animation: fadeIn 0.4s;
    }
    .slide.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(46,93,52,0.1);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin: 0 auto 20px;
    }
    .slide h2 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #2d2d2d;
    }
    .slide p {
      font-size: 1rem;
      color: #6c757d;
      line-height: 1.8;
      margin-bottom: 25px;
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ced4da;
      transition: background 0.3s;
    }
    .dot.active {
      background: var(--primary);
    }
    .btn-next {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 12px 30px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      width: 100%;
    }
    .btn-next:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }
    .btn-skip {
      background: transparent;
      border: none;
      color: #6c757d;
      font-size: 0.85rem;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="onboarding-container">
    <!-- شريحة 1 -->
    <div class="slide active">
      <div class="icon-circle"><i class="bi bi-shop-window"></i></div>
      <h2>مرحباً بك في سوق الحسينية الإلكتروني</h2>
      <p>سنوفر لك تجربة خيالية تجعلك تتسوق وأنت في بيتك.</p>
    </div>
    <!-- شريحة 2 -->
    <div class="slide">
      <div class="icon-circle"><i class="bi bi-bag-heart"></i></div>
      <h2>سوق الحسينية بين يديك</h2>
      <p>يمكنك تصفح المنتجات والمتاجر، وإضافة منتجاتك إلى السلة أو المفضلة واحتفظ بما تحب.</p>
    </div>
    <!-- شريحة 3 -->
    <div class="slide">
      <div class="icon-circle"><i class="bi bi-truck"></i></div>
      <h2>خدمة توصيل من أجلك</h2>
      <p>نوفر خدمة توصيل في أي مكان داخل الحسينية، كل ما عليك هو التصفح وطلب المنتجات.</p>
    </div>

    <div class="dots" id="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <button class="btn-next" id="nextBtn">متابعة</button>
    <button class="btn-skip" id="skipBtn">تخطي</button>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    const nextBtn = document.getElementById('nextBtn');
    const skipBtn = document.getElementById('skipBtn');
    let currentSlide = 0;

    function showSlide(index) {
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === index);
      });
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    function finishOnboarding() {
      localStorage.setItem('onboarding_done', 'true');
      window.location.href = '{{ url_for("auth.login") }}';
    }

    nextBtn.addEventListener('click', () => {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        showSlide(currentSlide);
        if (currentSlide === slides.length - 1) {
          nextBtn.textContent = 'ابدأ التسوق';
        }
      } else {
        finishOnboarding();
      }
    });

    skipBtn.addEventListener('click', finishOnboarding);
  </script>
</body>
</html>
